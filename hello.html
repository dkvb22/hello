<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello</title>
<script>
   document.addEventListener('DOMContentLoaded', function(){
     document.querySelector('form').onsubmit = function() {
        const name = document.querySelector('#name').value;
        alert(`hello , ${name}`);

     }
   })
   
    
</script>
</head>
<body>
    <h1>Hello World</h1>
    <form>
        <input autofocus id="name" placeholder="enter your name" text="fname">
        <input type="submit">
    </form>
</body>
</html>
